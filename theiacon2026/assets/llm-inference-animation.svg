<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background:#1a1a2e;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffd54f"/>
    </linearGradient>
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ce93d8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="kvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffab40;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ff6d00;stop-opacity:0.7"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Data packet marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#fafafa" font-family="sans-serif" font-size="22" font-weight="bold">LLM Inference: One Token Decode Step</text>
  <text x="600" y="58" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="13">Each generated token requires reading ALL model weights from memory through every layer</text>

  <!-- ========================================= -->
  <!-- HBM / VRAM (bottom bar) -->
  <!-- ========================================= -->
  <rect x="50" y="600" width="1100" height="70" rx="8" fill="url(#memGrad)" opacity="0.3" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="600" y="625" text-anchor="middle" fill="#4fc3f7" font-family="sans-serif" font-size="14" font-weight="bold">HBM / VRAM - Model Weights Storage (billions of parameters)</text>
  <text x="600" y="650" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="11">Bandwidth bottleneck: every weight read once per token | 7B model @ Q4 = 3.5 GB read per token</text>

  <!-- Weight blocks in HBM -->
  <g opacity="0.6">
    <rect x="70" y="630" width="80" height="25" rx="3" fill="url(#weightGrad)"/>
    <text x="110" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">Layer 0 Weights</text>
    <rect x="160" y="630" width="80" height="25" rx="3" fill="url(#weightGrad)"/>
    <text x="200" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">Layer 1 Weights</text>
    <rect x="250" y="630" width="80" height="25" rx="3" fill="url(#weightGrad)"/>
    <text x="290" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">Layer 2 Weights</text>
    <rect x="340" y="630" width="40" height="25" rx="3" fill="url(#weightGrad)"/>
    <text x="360" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">...</text>
    <rect x="390" y="630" width="80" height="25" rx="3" fill="url(#weightGrad)"/>
    <text x="430" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">Layer 31 Weights</text>
    <rect x="490" y="630" width="80" height="25" rx="3" fill="url(#kvGrad)"/>
    <text x="530" y="647" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">KV Cache</text>
    <rect x="580" y="630" width="80" height="25" rx="3" fill="#555" stroke="#888" stroke-width="0.5"/>
    <text x="620" y="647" text-anchor="middle" fill="#ccc" font-size="9" font-family="sans-serif">Embeddings</text>
  </g>

  <!-- ========================================= -->
  <!-- GPU Compute (middle area) -->
  <!-- ========================================= -->

  <!-- Input token (left side) -->
  <rect x="30" y="280" width="90" height="40" rx="20" fill="url(#tokenGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.05;1"/>
  </rect>
  <text x="75" y="305" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="12" font-weight="bold">Token In</text>

  <!-- Embedding lookup -->
  <rect x="145" y="270" width="80" height="60" rx="6" fill="#333" stroke="#888" stroke-width="1"/>
  <text x="185" y="295" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="10">Embedding</text>
  <text x="185" y="310" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="10">Lookup</text>

  <!-- Arrow: token to embedding -->
  <line x1="120" y1="300" x2="143" y2="300" stroke="#ffd54f" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0;1;1;0.3" dur="8s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.15"/>
  </line>

  <!-- Transformer Layer 0 -->
  <g>
    <rect x="260" y="170" width="160" height="260" rx="8" fill="url(#computeGrad)" opacity="0.15" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="340" y="195" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="11" font-weight="bold">Transformer Layer 0</text>

    <!-- Sub-operations -->
    <rect x="275" y="210" width="130" height="30" rx="4" fill="#2e7d32" opacity="0.7"/>
    <text x="340" y="230" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">Q K V Projection</text>

    <rect x="275" y="250" width="130" height="30" rx="4" fill="#1b5e20" opacity="0.7"/>
    <text x="340" y="270" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">Attention (Q @ K^T)</text>

    <rect x="275" y="290" width="130" height="30" rx="4" fill="#2e7d32" opacity="0.7"/>
    <text x="340" y="310" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">Output Projection</text>

    <rect x="275" y="330" width="130" height="30" rx="4" fill="#33691e" opacity="0.7"/>
    <text x="340" y="350" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">FFN (expand 4x)</text>

    <rect x="275" y="370" width="130" height="30" rx="4" fill="#33691e" opacity="0.7"/>
    <text x="340" y="390" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">FFN (compress)</text>

    <!-- Highlight animation cycling through sub-ops -->
    <rect x="275" y="210" width="130" height="30" rx="4" fill="#ffd54f" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0;0;0;0;0;0;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.5;0.7;1"/>
    </rect>
    <rect x="275" y="250" width="130" height="30" rx="4" fill="#ffd54f" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.4;0;0;0;0;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.5;0.7;1"/>
    </rect>
    <rect x="275" y="290" width="130" height="30" rx="4" fill="#ffd54f" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.4;0;0;0;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.5;0.7;1"/>
    </rect>
    <rect x="275" y="330" width="130" height="30" rx="4" fill="#ffd54f" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0.4;0;0;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.5;0.7;1"/>
    </rect>
    <rect x="275" y="370" width="130" height="30" rx="4" fill="#ffd54f" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0.4;0;0;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.2;0.25;0.3;0.35;0.4;0.5;0.7;1"/>
    </rect>
  </g>

  <!-- Arrow: embedding to layer 0 -->
  <line x1="225" y1="300" x2="258" y2="300" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Weight read arrows (from HBM up to layer 0) -->
  <g>
    <!-- Animated weight data flowing up from HBM -->
    <line x1="310" y1="598" x2="310" y2="432" stroke="#ce93d8" stroke-width="2" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="370" y1="598" x2="370" y2="432" stroke="#ce93d8" stroke-width="2" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="340" y="455" text-anchor="middle" fill="#ce93d8" font-family="sans-serif" font-size="9">Weight Read</text>
    <text x="340" y="468" text-anchor="middle" fill="#ce93d8" font-family="sans-serif" font-size="9">(~110 MB/layer)</text>
  </g>

  <!-- Transformer Layer 1 (simplified) -->
  <g>
    <rect x="460" y="220" width="100" height="160" rx="8" fill="url(#computeGrad)" opacity="0.12" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="510" y="250" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="11" font-weight="bold">Layer 1</text>
    <text x="510" y="290" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Same ops</text>
    <text x="510" y="310" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">repeated</text>

    <!-- Weight read -->
    <line x1="510" y1="598" x2="510" y2="382" stroke="#ce93d8" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Arrow: layer 0 to layer 1 -->
  <line x1="420" y1="300" x2="458" y2="300" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Dots indicating more layers -->
  <text x="590" y="305" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="24">...</text>
  <text x="590" y="330" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">x32 layers</text>
  <line x1="560" y1="300" x2="575" y2="300" stroke="#aaa" stroke-width="1.5"/>
  <line x1="605" y1="300" x2="620" y2="300" stroke="#aaa" stroke-width="1.5"/>

  <!-- Final layer (Layer 31) -->
  <g>
    <rect x="630" y="220" width="100" height="160" rx="8" fill="url(#computeGrad)" opacity="0.12" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="680" y="250" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="11" font-weight="bold">Layer 31</text>
    <text x="680" y="290" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Final</text>
    <text x="680" y="310" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">transform</text>

    <!-- Weight read -->
    <line x1="680" y1="598" x2="680" y2="382" stroke="#ce93d8" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- LM Head (output projection) -->
  <rect x="765" y="260" width="100" height="80" rx="6" fill="#333" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="815" y="290" text-anchor="middle" fill="#ffd54f" font-family="sans-serif" font-size="10" font-weight="bold">LM Head</text>
  <text x="815" y="308" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">Vocabulary</text>
  <text x="815" y="322" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">Projection</text>

  <!-- Arrow: layer 31 to LM head -->
  <line x1="730" y1="300" x2="763" y2="300" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Softmax / Sampling -->
  <rect x="895" y="265" width="90" height="70" rx="6" fill="#333" stroke="#ff9800" stroke-width="1.5"/>
  <text x="940" y="292" text-anchor="middle" fill="#ff9800" font-family="sans-serif" font-size="10" font-weight="bold">Softmax</text>
  <text x="940" y="310" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">+ Sample</text>

  <!-- Arrow: LM head to softmax -->
  <line x1="865" y1="300" x2="893" y2="300" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Output token -->
  <rect x="1020" y="280" width="100" height="40" rx="20" fill="url(#tokenGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;0;0;1;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.6;0.75;0.8;0.85;1"/>
  </rect>
  <text x="1070" y="305" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="11" font-weight="bold">Token Out</text>

  <!-- Arrow: softmax to output -->
  <line x1="985" y1="300" x2="1018" y2="300" stroke="#ffd54f" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0;0;0;1;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.7;0.8;0.85;1"/>
  </line>

  <!-- ========================================= -->
  <!-- KV Cache (side) -->
  <!-- ========================================= -->
  <rect x="880" y="420" width="250" height="80" rx="6" fill="url(#kvGrad)" opacity="0.2" stroke="#ffab40" stroke-width="1"/>
  <text x="1005" y="445" text-anchor="middle" fill="#ffab40" font-family="sans-serif" font-size="11" font-weight="bold">KV Cache (grows with context)</text>
  <text x="1005" y="465" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">Stores Key/Value pairs from all previous tokens</text>
  <text x="1005" y="480" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">Avoids recomputing attention for past tokens</text>

  <!-- Arrow from layers to KV cache (bidirectional) -->
  <line x1="730" y1="360" x2="878" y2="440" stroke="#ffab40" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <text x="800" y="405" fill="#ffab40" font-family="sans-serif" font-size="9">read + append</text>

  <!-- ========================================= -->
  <!-- Timing / Stats box -->
  <!-- ========================================= -->
  <rect x="880" y="100" width="270" height="140" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="1015" y="125" text-anchor="middle" fill="#fafafa" font-family="sans-serif" font-size="12" font-weight="bold">One Decode Step (7B Q4)</text>
  <text x="895" y="150" fill="#4fc3f7" font-family="sans-serif" font-size="11">Memory read:</text>
  <text x="1070" y="150" fill="#fff" font-family="sans-serif" font-size="11">~3.5 GB (all weights)</text>
  <text x="895" y="172" fill="#66bb6a" font-family="sans-serif" font-size="11">Compute:</text>
  <text x="1070" y="172" fill="#fff" font-family="sans-serif" font-size="11">~14 billion FLOPs</text>
  <text x="895" y="194" fill="#ce93d8" font-family="sans-serif" font-size="11">Arithmetic intensity:</text>
  <text x="1070" y="194" fill="#fff" font-family="sans-serif" font-size="11">~2 ops/byte (low!)</text>
  <text x="895" y="216" fill="#ffd54f" font-family="sans-serif" font-size="11">Time @ 1 TB/s BW:</text>
  <text x="1070" y="216" fill="#fff" font-family="sans-serif" font-size="11">~3.5 ms = ~286 tok/s</text>
  <text x="895" y="232" fill="#888" font-family="sans-serif" font-size="9">(RTX 4090 theoretical max)</text>

  <!-- ========================================= -->
  <!-- Legend -->
  <!-- ========================================= -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="100" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="10" y="18" fill="#aaa" font-family="sans-serif" font-size="10" font-weight="bold">Legend</text>
    <rect x="10" y="26" width="20" height="10" rx="2" fill="url(#tokenGrad)"/>
    <text x="35" y="35" fill="#ccc" font-family="sans-serif" font-size="9">Token (input/output)</text>
    <rect x="10" y="42" width="20" height="10" rx="2" fill="url(#computeGrad)" opacity="0.5"/>
    <text x="35" y="51" fill="#ccc" font-family="sans-serif" font-size="9">GPU Compute (transformer layers)</text>
    <line x1="10" y1="63" x2="30" y2="63" stroke="#ce93d8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="35" y="67" fill="#ccc" font-family="sans-serif" font-size="9">Weight reads from HBM (bottleneck!)</text>
    <rect x="10" y="74" width="20" height="10" rx="2" fill="url(#kvGrad)" opacity="0.5"/>
    <text x="35" y="83" fill="#ccc" font-family="sans-serif" font-size="9">KV Cache (context memory)</text>
  </g>

  <!-- Animated data flow: token moving through the pipeline -->
  <circle r="5" fill="#ffd54f" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.15;0.3;0.5;0.65;0.8;0.95;1" keyTimes="0;0.1;0.2;0.4;0.55;0.7;0.85;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1">
      <mpath>
        <path d="M 75,300 L 185,300 L 340,300 L 510,300 L 590,300 L 680,300 L 815,300 L 940,300 L 1070,300" fill="none"/>
      </mpath>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;1;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.05;0.1;0.3;0.5;0.7;0.85;0.9;1"/>
  </circle>

  <!-- Repeat indicator -->
  <text x="1070" y="340" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Repeat for every token generated</text>
  <path d="M 1070,350 C 1070,380 1070,380 1050,380 L 100,380 C 80,380 80,380 80,350 L 80,320" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
  <text x="550" y="395" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="9">Feed output token back as next input (autoregressive)</text>

</svg>
