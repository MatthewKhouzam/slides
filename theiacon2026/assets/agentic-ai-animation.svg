<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background:#1a1a2e;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="harnessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0277bd;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="feedbackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffab40;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ff6d00;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffd54f"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ce93d8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:0.85"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66bb6a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffab40"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ce93d8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#fafafa" font-family="sans-serif" font-size="22" font-weight="bold">Agentic AI: The LLM-in-the-Loop Architecture</text>
  <text x="600" y="58" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="13">A harness orchestrates the LLM, invoking tools and feeding results back in a reasoning loop</text>

  <!-- ========================================= -->
  <!-- Central LLM -->
  <!-- ========================================= -->
  <ellipse cx="600" cy="350" rx="120" ry="70" fill="url(#llmGrad)" stroke="#b388ff" stroke-width="2.5" filter="url(#glowStrong)">
    <animate attributeName="rx" values="120;125;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="70;73;70" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <text x="600" y="340" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">LLM</text>
  <text x="600" y="365" text-anchor="middle" fill="#e1bee7" font-family="sans-serif" font-size="12">(Reasoning Engine)</text>
  <text x="600" y="385" text-anchor="middle" fill="#ce93d8" font-family="sans-serif" font-size="10">Generates text, plans actions</text>

  <!-- ========================================= -->
  <!-- Harness / Orchestrator (top) -->
  <!-- ========================================= -->
  <rect x="480" y="100" width="240" height="70" rx="12" fill="url(#harnessGrad)" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="130" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold">Agent Harness</text>
  <text x="600" y="152" text-anchor="middle" fill="#b3e5fc" font-family="sans-serif" font-size="11">Orchestrator / Control Loop</text>

  <!-- Arrow: Harness → LLM (prompt) -->
  <line x1="560" y1="170" x2="560" y2="278" stroke="#4fc3f7" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowBlue)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <text x="535" y="225" text-anchor="end" fill="#4fc3f7" font-family="sans-serif" font-size="11">prompt</text>

  <!-- Arrow: LLM → Harness (response) -->
  <line x1="640" y1="278" x2="640" y2="170" stroke="#b388ff" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowPurple)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <text x="665" y="225" text-anchor="start" fill="#ce93d8" font-family="sans-serif" font-size="11">response / action</text>

  <!-- ========================================= -->
  <!-- Tools (right side) -->
  <!-- ========================================= -->
  <!-- Tool cluster -->
  <rect x="870" y="190" width="160" height="50" rx="8" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="950" y="212" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">🔍 Web Search</text>
  <text x="950" y="228" text-anchor="middle" fill="#c8e6c9" font-family="sans-serif" font-size="9">API call</text>

  <rect x="870" y="260" width="160" height="50" rx="8" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="950" y="282" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">💻 Code Executor</text>
  <text x="950" y="298" text-anchor="middle" fill="#c8e6c9" font-family="sans-serif" font-size="9">Sandbox / REPL</text>

  <rect x="870" y="330" width="160" height="50" rx="8" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="950" y="352" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">📁 File System</text>
  <text x="950" y="368" text-anchor="middle" fill="#c8e6c9" font-family="sans-serif" font-size="9">Read / Write</text>

  <rect x="870" y="400" width="160" height="50" rx="8" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="950" y="422" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">🗄️ Database</text>
  <text x="950" y="438" text-anchor="middle" fill="#c8e6c9" font-family="sans-serif" font-size="9">Query / Mutate</text>

  <rect x="870" y="470" width="160" height="50" rx="8" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="950" y="492" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">🌐 External APIs</text>
  <text x="950" y="508" text-anchor="middle" fill="#c8e6c9" font-family="sans-serif" font-size="9">REST / GraphQL</text>

  <!-- "Tools" label -->
  <text x="950" y="175" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="14" font-weight="bold">Tools</text>

  <!-- Arrow: Harness → Tools (tool invocation) -->
  <path d="M 720 130 Q 800 130 850 215" fill="none" stroke="#66bb6a" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowGreen)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="790" y="155" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="11">invoke tool</text>

  <!-- Arrow: Tools → Harness (tool results) -->
  <path d="M 870 350 Q 810 350 770 155" fill="none" stroke="#ffab40" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowOrange)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="840" y="250" text-anchor="start" fill="#ffab40" font-family="sans-serif" font-size="11">results</text>

  <!-- ========================================= -->
  <!-- User / Input (left side) -->
  <!-- ========================================= -->
  <rect x="100" y="300" width="160" height="70" rx="12" fill="url(#userGrad)" stroke="#ce93d8" stroke-width="2" filter="url(#glow)"/>
  <text x="180" y="330" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="15" font-weight="bold">👤 User</text>
  <text x="180" y="352" text-anchor="middle" fill="#e1bee7" font-family="sans-serif" font-size="11">Task / Goal</text>

  <!-- Arrow: User → Harness -->
  <path d="M 260 315 Q 350 200 480 130" fill="none" stroke="#ce93d8" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowPurple)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="330" y="195" text-anchor="middle" fill="#ce93d8" font-family="sans-serif" font-size="11">user request</text>

  <!-- Arrow: Harness → User (final output) -->
  <path d="M 480 155 Q 350 250 260 345" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="320" y="290" text-anchor="middle" fill="#ff6b6b" font-family="sans-serif" font-size="11">final answer</text>

  <!-- ========================================= -->
  <!-- Feedback / Loop (bottom) -->
  <!-- ========================================= -->
  <rect x="430" y="480" width="340" height="60" rx="10" fill="url(#feedbackGrad)" opacity="0.2" stroke="#ffab40" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="508" text-anchor="middle" fill="#ffab40" font-family="sans-serif" font-size="13" font-weight="bold">Feedback &amp; Memory</text>
  <text x="600" y="528" text-anchor="middle" fill="#ffe0b2" font-family="sans-serif" font-size="10">Context window, conversation history, tool outputs appended</text>

  <!-- Arrow: LLM → Feedback -->
  <line x1="580" y1="420" x2="560" y2="480" stroke="#ffab40" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Arrow: Feedback → LLM (loop back via harness) -->
  <path d="M 600 480 Q 600 450 600 420" fill="none" stroke="#ffab40" stroke-width="2" stroke-dasharray="6,3" opacity="0"/>
  <!-- Feedback loops back up through the harness -->
  <path d="M 640 480 Q 750 470 750 350 Q 750 180 720 145" fill="none" stroke="#ffab40" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="770" y="320" text-anchor="start" fill="#ffab40" font-family="sans-serif" font-size="10">loop back</text>

  <!-- ========================================= -->
  <!-- The Loop Indicator (circular arrow) -->
  <!-- ========================================= -->
  <!-- Circular loop around center to show iteration -->
  <circle cx="400" cy="350" r="230" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="30"/>

  <!-- Animated loop pulse -->
  <circle cx="0" cy="0" r="8" fill="#4fc3f7" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>
  <path id="loopPath" d="M 400 120 A 230 230 0 1 0 400 580 A 230 230 0 1 0 400 120" fill="none" stroke="none"/>

  <!-- Second pulse (offset) -->
  <circle cx="0" cy="0" r="6" fill="#66bb6a" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="2s">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>

  <!-- Third pulse (offset) -->
  <circle cx="0" cy="0" r="6" fill="#ffab40" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="4s">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>

  <!-- ========================================= -->
  <!-- Step labels (bottom legend) -->
  <!-- ========================================= -->
  <rect x="60" y="590" width="1080" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="600" y="615" text-anchor="middle" fill="#fafafa" font-family="sans-serif" font-size="13" font-weight="bold">The Agentic Loop</text>

  <!-- Step 1 -->
  <circle cx="130" cy="645" r="14" fill="url(#harnessGrad)" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="130" y="650" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">1</text>
  <text x="155" y="650" text-anchor="start" fill="#aaa" font-family="sans-serif" font-size="11">Harness sends prompt to LLM</text>

  <!-- Step 2 -->
  <circle cx="380" cy="645" r="14" fill="url(#llmGrad)" stroke="#b388ff" stroke-width="1.5"/>
  <text x="380" y="650" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">2</text>
  <text x="405" y="650" text-anchor="start" fill="#aaa" font-family="sans-serif" font-size="11">LLM reasons &amp; emits action</text>

  <!-- Step 3 -->
  <circle cx="620" cy="645" r="14" fill="url(#toolGrad)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="620" y="650" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">3</text>
  <text x="645" y="650" text-anchor="start" fill="#aaa" font-family="sans-serif" font-size="11">Harness invokes tool</text>

  <!-- Step 4 -->
  <circle cx="840" cy="645" r="14" fill="url(#feedbackGrad)" stroke="#ffab40" stroke-width="1.5"/>
  <text x="840" y="650" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">4</text>
  <text x="865" y="650" text-anchor="start" fill="#aaa" font-family="sans-serif" font-size="11">Result fed back → repeat</text>

  <!-- Iteration counter animation -->
  <text x="180" y="460" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="60" font-weight="bold">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
    ∞
  </text>
  <text x="180" y="490" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11">iterates until</text>
  <text x="180" y="505" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11">goal is met</text>

  <!-- Token counter -->
  <text x="1050" y="58" text-anchor="end" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">
    Tokens: <tspan id="tokenCount">0</tspan>
  </text>
  <script type="text/javascript"><![CDATA[
    (function() {
      var count = 0;
      var el = document.getElementById('tokenCount');
      setInterval(function() {
        count+=71;
        el.textContent = count.toLocaleString();
      }, 10);
    })();
  ]]></script>

</svg>
